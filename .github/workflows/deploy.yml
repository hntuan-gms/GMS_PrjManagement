name: Deploy to Cloud Run

# Builds the root Dockerfile (client + server into one image), pushes it to
# Artifact Registry, and rolls out a new Cloud Run revision on every push to main.
#
# One-time setup — see the "Setup" section of this workflow's PR/commit notes:
#   Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#     GCP_PROJECT_ID           e.g. gms-prjmanagement-prod
#     GCP_REGION               e.g. asia-southeast1
#     GCP_SERVICE_ACCOUNT      deployer SA email, e.g. gh-deployer@PROJECT.iam.gserviceaccount.com
#     GCP_WIF_PROVIDER         projects/NNN/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#     ATLASSIAN_CLIENT_ID      from developer.atlassian.com/console/myapps
#     APP_BASE_URL             https://gms-prjmanagement-ftlpeveyxa-as.a.run.app
#     ALLOWED_EMAIL_DOMAIN     gimasys.com
#   Secret Manager secrets (NOT GitHub secrets):
#     atlassian-client-secret  the OAuth app's client secret
#     session-encryption-keys  "k1:<32 random bytes, base64url>" — see server/.env.example
#     database-url             postgresql://USER:PASS@/gms?host=/cloudsql/<connection name>
#                              (carries a password, so Secret Manager rather than a
#                              plain env var — scripts/setup-gcp-db.ps1 creates it)
#     video-agent-gemini-api-key  shared with the video-agent service, which owns it.
#                              Only the AI planner routes read it, and they fail with
#                              a clear message rather than at boot if it is missing —
#                              everything else in the app works without it.
#
# The Atlassian app's Callback URL must be exactly $APP_BASE_URL/api/auth/callback.
# Atlassian allows one callback per app, so local dev needs a second app.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keyless auth to Google Cloud via Workload Identity Federation needs id-token.
permissions:
  contents: read
  id-token: write

# Never let two deploys race to become the live revision.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  REPOSITORY: gms-project-manager # existing Artifact Registry repo in asia-southeast1
  SERVICE: gms-prjmanagement # existing Cloud Run service name
  # Shared instance: it also hosts the intern portal (intern_db) and hnxcis. This
  # app gets its own database and user on it, so nothing can collide with theirs.
  CLOUDSQL_INSTANCE: intern-portal-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Cloud Run only runs linux/amd64.
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest
          # Two `npm ci` stages make cold builds slow; reuse layers across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          # Deploy the immutable SHA tag, not :latest, so a rollback is unambiguous.
          image: ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          # PORT is reserved: Cloud Run injects PORT=8080 and server/src/index.ts
          # already honours it (`process.env.PORT ?? 4000`). Setting it here is rejected.
          # There is no fallback mode: the server exits at boot if any of these or
          # the two secrets below are missing.
          env_vars: |-
            ATLASSIAN_CLIENT_ID=${{ vars.ATLASSIAN_CLIENT_ID }}
            APP_BASE_URL=${{ vars.APP_BASE_URL }}
            ALLOWED_EMAIL_DOMAIN=${{ vars.ALLOWED_EMAIL_DOMAIN }}
          # The runtime service account needs roles/secretmanager.secretAccessor on
          # both. Rotate session-encryption-keys by PREPENDING a new key — replacing
          # the list outright logs every user out immediately.
          secrets: |-
            ATLASSIAN_CLIENT_SECRET=atlassian-client-secret:latest
            SESSION_ENCRYPTION_KEYS=session-encryption-keys:latest
            DATABASE_URL=database-url:latest
            GEMINI_API_KEY=video-agent-gemini-api-key:latest
          # overwrite (--set-env-vars / --set-secrets) rather than the default merge
          # (--update-*): this file is the sole source of truth for the service's
          # environment, so removing a line here removes it from the live service and
          # anything set by hand is reverted on the next deploy.
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=1
            --timeout=300s
            --add-cloudsql-instances=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:${{ env.CLOUDSQL_INSTANCE }}
          # allow-unauthenticated is REQUIRED here, not a relaxation for convenience:
          # Atlassian redirects the browser back to /api/auth/callback, and that
          # navigation cannot carry a Google-signed ID token, so Cloud Run IAM would
          # reject it before Express ever runs. The consequence is that the app's own
          # requireAuth middleware (mounted via apiRouter.use, so it is fail-closed)
          # plus ALLOWED_EMAIL_DOMAIN are the only access control in front of Jira.
          #
          # add-cloudsql-instances mounts the instance's unix socket at
          # /cloudsql/<connection name>, which is what the socket form of
          # DATABASE_URL points at — no proxy and no TLS config needed here. The
          # runtime service account needs roles/cloudsql.client for it to connect.
          #
          # The server runs pending migrations at boot (server/src/db/migrate.ts),
          # serialised across instances by a Postgres advisory lock, so a schema
          # change ships with the release that needs it.
          #
          # timeout=300s is for the AI planner: breaking a project brief into a
          # forty-task WBS is a single long model call, and the previous 60s was
          # enough for the CRUD routes but would cut a plan off mid-generation.
          #
          # max-instances=1 is no longer about a single-writer file — the overlay is
          # in Postgres now and each write is atomic. What is left is that a
          # dependency cascade is several statements rather than one transaction, so
          # two concurrent cascades over the same tasks could still interleave.
          # Raising this is safe for everything except that.

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision image: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
