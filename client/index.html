<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>GMS · Bàn làm việc</title>
    <script>
      // Theme and density before the first paint, so a dark-mode user never sees a white flash.
      // Same keys and rules as src/theme.ts (which takes over once the app runs).
      (function () {
        try {
          var t = localStorage.getItem("gms.theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var d = localStorage.getItem("gms.density");
          if (d === "compact" || d === "comfortable") document.documentElement.dataset.density = d;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <!-- Splash: drawn from the first byte, before any script or font, and handed over by src/splash.ts.
         Same drawing as components/BrandMark.tsx and public/favicon.svg. The colours are written here
         because tokens.css has not loaded yet; they are tokens.css's --paper/--ink/--son. -->
    <style>
      #gms-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f6f5f1;
        pointer-events: none;
      }
      html[data-theme="dark"] #gms-splash { background: #121211; }
      .sp-lockup { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .sp-mark { display: block; width: 56px; height: 56px; overflow: visible; }
      .sp-tile { fill: #1d1c1a; }
      .sp-g { fill: none; stroke: #f6f5f1; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .sp-dot { fill: #e0531f; transform-box: fill-box; transform-origin: center; }
      html[data-theme="dark"] .sp-tile { fill: #edebe6; }
      html[data-theme="dark"] .sp-g { stroke: #121211; }
      html[data-theme="dark"] .sp-dot { fill: #f26b38; }
      .sp-word {
        font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.28em;
        padding-left: 0.28em;
        color: #8a877f;
      }
      /* First open in this tab: the mark is drawn (≈0.6s). Later reloads: it is simply there, and only
         if loading takes longer than a blink. */
      #gms-splash.is-intro .sp-mark { animation: sp-in 280ms cubic-bezier(.23, 1, .32, 1) both; }
      #gms-splash.is-intro .sp-g { stroke-dasharray: 1; animation: sp-draw 420ms cubic-bezier(.65, 0, .35, 1) 120ms both; }
      #gms-splash.is-intro .sp-dot { animation: sp-pop 240ms cubic-bezier(.34, 1.56, .64, 1) 480ms both, sp-wait 1200ms ease-in-out 1100ms infinite; }
      #gms-splash.is-intro .sp-word { animation: sp-rise 260ms cubic-bezier(.23, 1, .32, 1) 340ms both; }
      /* Reload in a tab that has already seen it: no logo at all, only the paper colour so the page
         does not flash white while the app loads. */
      #gms-splash.is-quick .sp-lockup { display: none; }
      @keyframes sp-in { from { opacity: 0; transform: scale(.84); } }
      @keyframes sp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes sp-pop { from { transform: scale(0); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(4px); } }
      @keyframes sp-fade { from { opacity: 0; } }
      @keyframes sp-wait { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) {
        #gms-splash *, #gms-splash { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="gms-splash" aria-hidden="true">
      <div class="sp-lockup">
        <svg class="sp-mark" viewBox="0 0 32 32" focusable="false">
          <rect class="sp-tile" width="32" height="32" rx="8" />
          <path class="sp-g" pathLength="1" d="M22.4 10.2A8.5 8.5 0 1 0 24.5 16H17" />
          <circle class="sp-dot" cx="13.4" cy="16" r="2.2" />
        </svg>
        <div class="sp-word">GIMASYS</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("gms-splash");
        var seen = false;
        try {
          seen = sessionStorage.getItem("gms.splash") === "1";
        } catch (e) {}
        el.className = seen ? "is-quick" : "is-intro";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
