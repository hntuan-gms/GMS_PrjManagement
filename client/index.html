<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>GMS · Bàn làm việc</title>
    <script>
      // Theme and density before the first paint, so a dark-mode user never sees a white flash.
      // Same keys and rules as src/theme.ts (which takes over once the app runs).
      (function () {
        try {
          var t = localStorage.getItem("gms.theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var d = localStorage.getItem("gms.density");
          if (d === "compact" || d === "comfortable") document.documentElement.dataset.density = d;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <!-- Splash: drawn from the first byte, before any script or font, and handed over by src/splash.ts.
         The Gimasys wordmark from public/brand/ (the same files as components/BrandMark.tsx). The
         colours are written here because tokens.css has not loaded yet; they are tokens.css's --paper. -->
    <style>
      #gms-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      /* The paper colour is its own layer so that leaving is an opacity fade (compositor), not a
         background-colour animation (repaints the whole window on the main thread, under a busy app). */
      .sp-bg { position: absolute; inset: 0; background: #f6f5f1; }
      html[data-theme="dark"] .sp-bg { background: #121211; }
      .sp-lockup { position: relative; }
      /* A background image, so only the copy for the current theme is downloaded. 422 × 114. */
      .sp-logo { position: relative; width: 220px; height: 59px; background: url("/brand/gimasys-logo.png") center / contain no-repeat; }
      html[data-theme="dark"] .sp-logo { background-image: url("/brand/gimasys-logo-dark.png"); }
      /* The intro reveals the wordmark left to right with a cover in the paper's colour sliding off
         it. Everything that moves here is transform or opacity on an HTML element, which the browser
         runs off the main thread: the page's script (hundreds of ms of parsing and first render, right
         while this plays) cannot stall it. Drawing a stroke (stroke-dashoffset) stalled for most of a second. */
      .sp-clip { position: absolute; inset: -2px; overflow: hidden; }
      .sp-cover { position: absolute; inset: 0; background: #f6f5f1; transform: scaleX(0); transform-origin: right center; }
      html[data-theme="dark"] .sp-cover { background: #121211; }
      /* First open in this tab: the wordmark is revealed (≈0.8s). Later reloads: no logo at all. */
      #gms-splash.is-intro .sp-logo { animation: sp-in 420ms cubic-bezier(.23, 1, .32, 1) both; }
      #gms-splash.is-intro .sp-cover { animation: sp-wipe 640ms cubic-bezier(.65, 0, .35, 1) 180ms backwards; }
      /* Reload in a tab that has already seen it: no logo at all, only the paper colour so the page
         does not flash white while the app loads. */
      #gms-splash.is-quick .sp-lockup { display: none; }
      @keyframes sp-in { from { opacity: 0; transform: scale(.84); } }
      @keyframes sp-wipe { from { transform: scaleX(1); } }
      @keyframes sp-fade { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #gms-splash *, #gms-splash { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="gms-splash" aria-hidden="true">
      <div class="sp-bg"></div>
      <div class="sp-lockup">
        <div class="sp-logo">
          <span class="sp-clip"><span class="sp-cover"></span></span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("gms-splash");
        var seen = false;
        try {
          seen = sessionStorage.getItem("gms.splash") === "1";
        } catch (e) {}
        el.className = seen ? "is-quick" : "is-intro";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
