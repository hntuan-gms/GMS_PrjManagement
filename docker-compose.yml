services:
  # pgvector's image rather than plain postgres: the same instance will hold the
  # PRD/BRD embeddings the planning agent retrieves over, and enabling the
  # extension later on a stock image means rebuilding this service.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gms
      POSTGRES_PASSWORD: gms
      POSTGRES_DB: gms
    ports:
      - "5432:5432"
    volumes:
      - gms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gms -d gms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - server/.env
    environment:
      - PORT=4000
      # Overrides whatever server/.env says: inside the compose network the
      # database is reachable as `db`, not localhost.
      - DATABASE_URL=postgresql://gms:gms@db:5432/gms
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gms-pgdata:
